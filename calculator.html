<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Casri Ah</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f5f2eb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .calculator {
      background-color: #121815;
      padding: 20px;
      border-radius: 25px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3);
      width: 320px;
    }

    .display {
      background-color: transparent;
      color: #ffffff;
      text-align: right;
      padding: 20px 10px;
      font-size: 2.5rem;
      min-height: 80px;
      word-wrap: break-word;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      background-color: #242c28;
      color: #e0e0e0;
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.95);
    }

    button.btn-green {
      color: #4ade80;
    }

    button.btn-span-2 {
      grid-column: span 2;
    }

    button.btn-equals {
      background-color: #2e3832;
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn-green btn-span-2" onclick="clearDisplay()">AC</button>
      <button class="btn-green" onclick="deleteLast()">DEL</button>
      <button class="btn-green" onclick="appendOperator('/')">/</button>
      
      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="btn-green" onclick="appendOperator('+')">+</button>
      
      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="btn-green" onclick="appendOperator('-')">-</button>
      
      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="btn-green" onclick="appendOperator('*')">*</button>
      
      <button onclick="appendNumber('.')">.</button>
      <button onclick="appendNumber('0')">0</button>
      <button class="btn-equals btn-span-2" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');
    let currentInput = '0';

    function updateDisplay() {
      display.innerText = currentInput;
    }

    function appendNumber(num) {
      if (currentInput === '0' && num !== '.') {
        currentInput = num;
      } else {
        currentInput += num;
      }
      updateDisplay();
    }

    function appendOperator(op) {
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '*', '/'].includes(lastChar)) {
        currentInput = currentInput.slice(0, -1) + op;
      } else {
        currentInput += op;
      }
      updateDisplay();
    }

    function clearDisplay() {
      currentInput = '0';
      updateDisplay();
    }

    function deleteLast() {
      if (currentInput.length === 1) {
        currentInput = '0';
      } else {
        currentInput = currentInput.slice(0, -1);
      }
      updateDisplay();
    }

    function calculate() {
      try {
        currentInput = eval(currentInput).toString();
      } catch (error) {
        currentInput = 'Error';
      }
      updateDisplay();
    }
  </script>

</body>
</html>
