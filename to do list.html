<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #153677, #4e085f);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: #fff;
            margin: 100px auto 20px;
            padding: 40px 30px 70px;
            border-radius: 10px;
        }

        .todo-app h2 {
            color: #002765;
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #edeef0;
            border-radius: 30px;
            padding-left: 20px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 10px;
            font-size: 14px;
        }

        button {
            border: none;
            outline: none;
            padding: 16px 50px;
            background: #ff5945;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            border-radius: 40px;
        }

        ul li {
            list-style: none;
            font-size: 17px;
            padding: 12px 8px 12px 45px;
            user-select: none;
            cursor: pointer;
            position: relative;
        }

        ul li::before {
            content: '○';
            position: absolute;
            font-size: 20px;
            color: #555;
            top: 10px;
            left: 15px;
        }

        ul li.checked {
            color: #888;
            text-decoration: line-through;
        }

        ul li.checked::before {
            content: '✓';
            color: #ff5945;
            font-weight: bold;
        }

        ul li span {
            position: absolute;
            right: 0;
            top: 5px;
            width: 40px;
            height: 40px;
            font-size: 22px;
            color: #555;
            line-height: 40px;
            text-align: center;
            border-radius: 50%;
        }

        ul li span:hover {
            background: #edeef0;
            color: #ff5945;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="todo-app">
        <h2>To-Do List 📝</h2>
        <div class="row">
            <input type="text" id="input-box" placeholder="Khuadadaada halkan ku qor...">
            <button onclick="addTask()">Ku dar</button>
        </div>
        <ul id="list-container">
            <!-- Xogta la qorto halkan ayay ku kaydsamaysaa -->
        </ul>
    </div>
</div>

<script>
    const inputBox = document.getElementById("input-box");
    const listContainer = document.getElementById("list-container");

    function addTask() {
        if (inputBox.value === '') {
            alert("Fadlan meesha wax ku qor!");
        } else {
            let li = document.createElement("li");
            li.innerHTML = inputBox.value;
            listContainer.appendChild(li);
            
            let span = document.createElement("span");
            span.innerHTML = "\u00d7"; // Astaanta xiritaanka/delete-ka (×)
            li.appendChild(span);
        }
        inputBox.value = "";
        saveData();
    }

    listContainer.addEventListener("click", function(e) {
        if (e.target.tagName === "LI") {
            e.target.classList.toggle("checked");
            saveData();
        } else if (e.target.tagName === "SPAN") {
            e.target.parentElement.remove();
            saveData();
        }
    }, false);

    function saveData() {
        localStorage.setItem("data", listContainer.innerHTML);
    }

    function showTask() {
        listContainer.innerHTML = localStorage.getItem("data");
    }

    showTask();
</script>

</body>
</html>
