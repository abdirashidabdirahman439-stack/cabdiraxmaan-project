<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <!-- FontAwesome icons si loo helo astaanta tirtirista (trash icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4b6cb7, #182848);
            min-height: 100vh;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #fff;
            font-size: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-add {
            background: #ff5945;
            color: #fff;
            border: none;
            outline: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s ease;
        }

        .btn-add:hover {
            background: #e04835;
            transform: translateY(-2px);
        }

        .notes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .input-box {
            position: relative;
            width: 100%;
            height: 200px;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            outline: none;
            border: none;
            resize: none;
            font-size: 15px;
            line-height: 1.5;
            color: #333;
        }

        .note-wrapper {
            position: relative;
        }

        .note-wrapper i {
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 18px;
            color: #888;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .note-wrapper i:hover {
            color: #ff5945;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-regular fa-note-sticky"></i> Notes App</h1>
        <button class="btn-add" id="create-btn">
            <i class="fa-solid fa-plus"></i> Ku Dar Note
        </button>
    </div>

    <div class="notes-container" id="notes-container">
        <!-- Xusuus-qorrada halkan ayay ku soo baxayaan -->
    </div>
</div>

<script>
    const notesContainer = document.getElementById("notes-container");
    const createBtn = document.getElementById("create-btn");

    // Soo bandhig xogta kaydsan marka bogga la furo
    function showNotes() {
        notesContainer.innerHTML = localStorage.getItem("notes") || "";
        attachDeleteEvents();
        attachInputEvents();
    }

    // Kaydi xogta
    function updateStorage() {
        localStorage.setItem("notes", notesContainer.innerHTML);
    }

    // Abuur Note cusub
    createBtn.addEventListener("click", () => {
        let noteWrapper = document.createElement("div");
        noteWrapper.className = "note-wrapper";

        let inputBox = document.createElement("p");
        inputBox.className = "input-box";
        inputBox.setAttribute("contenteditable", "true");

        let deleteIcon = document.createElement("i");
        deleteIcon.className = "fa-solid fa-trash";

        noteWrapper.appendChild(inputBox);
        noteWrapper.appendChild(deleteIcon);
        notesContainer.appendChild(noteWrapper);

        updateStorage();
        attachDeleteEvents();
        attachInputEvents();
    });

    // Ku xidh dhacdada tirtirista
    function attachDeleteEvents() {
        const deleteIcons = notesContainer.querySelectorAll(".fa-trash");
        deleteIcons.forEach(icon => {
            icon.onclick = function() {
                this.parentElement.remove();
                updateStorage();
            }
        });
    }

    // Ku xidh dhacdada marka wax la qorayo si ay u kaydsanto
    function attachInputEvents() {
        const inputBoxes = notesContainer.querySelectorAll(".input-box");
        inputBoxes.forEach(box => {
            box.onkeyup = function() {
                updateStorage();
            }
        });
    }

    showNotes();
</script>

</body>
</html>
